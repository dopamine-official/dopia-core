name: Check frontend
on:
  # Only when the frontend or what it builds from changes: backend and AI changes have their
  # own checks. Branch pushes are checked by their PR, so push runs only on dev and main.
  push:
    branches: [dev, main]
    paths:
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/check.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/check.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - run: npm run build
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: npm run test:e2e
