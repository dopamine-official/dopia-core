services:
  db:
    image: postgres:17
    container_name: dopia-db
    environment:
      POSTGRES_DB: dopia
      POSTGRES_USER: dopia
      POSTGRES_PASSWORD: dopia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dopia -d dopia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
