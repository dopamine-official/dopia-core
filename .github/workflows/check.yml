name: Check frontend
on:
  # Only when the frontend or what it builds from changes: backend and AI changes have their
  # own checks. Branch pushes are checked by their PR, so push runs only on dev and main.
  push:
    branches: [dev, main]
    paths:
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/check.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/check.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - run: npm run build
  # The browser tests take most of the time, so they run in three parts at once, each
  # with its own server. Together they use a little more CI time than one run.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --with-deps downloads system packages from the Ubuntu servers, which the runner
      # sometimes cannot reach. The browser alone comes from elsewhere, so fall back to it
      # and let the tests run.
      - run: pnpm --dir frontend exec playwright install --with-deps chromium || pnpm --dir frontend exec playwright install chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
